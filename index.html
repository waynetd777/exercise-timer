<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121314" />
    <meta name="description" content="Interval timer for gym routines" />
    <!-- iOS needs its own icon and standalone hint; the manifest is not enough. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Exercise" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="favicon-64.png" sizes="64x64" type="image/png" />
    <title>Exercise Timer</title>
    <!--
      The ground, inline, so the FIRST paint is dark.

      Pull-to-refresh reloads the app, and until the bundled stylesheet arrives
      the canvas is the browser default: a white screen, in a dark app, on a
      phone, at the gym. An inline colour costs nothing and there is nothing
      earlier to put it in. Matches --ink-900 and the theme colour above.
    -->
    <style>
      html {
        background: #121314;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
